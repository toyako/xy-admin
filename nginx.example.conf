# xy-admin (管理后台) Nginx 安全配置示例
# 部署时将本文件作为参考，配置到实际 nginx server 块中

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # TLS 最低版本
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ========== 安全响应头 ==========

    # 点击劫持防护（与 index.html meta CSP 双重保障）
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # MIME 类型嗅探防护
    add_header X-Content-Type-Options "nosniff" always;

    # XSS 过滤器
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 移除服务器版本信息
    server_tokens off;

    # ========== 速率限制 ==========
    # 通用 API
    limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
    # 登录接口（严格限制）
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

    # ========== 请求体限制 ==========
    client_max_body_size 1m;

    # ========== 静态资源 ==========
    root /var/www/xy-admin;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        limit_req zone=admin_api burst=20 nodelay;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 登录接口特殊限速
        location /api/auth/login {
            limit_req zone=admin_login burst=3 nodelay;
            proxy_pass http://127.0.0.1:3300;
        }
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
